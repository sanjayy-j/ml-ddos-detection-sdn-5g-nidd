[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "m3-sdn"
version = "0.1.0"
description = "Reproducible sampled-telemetry SDN DDoS experiments with HAT and ADWIN"
requires-python = ">=3.12,<3.15"
dependencies = [
  "river>=0.22,<0.24", "fastapi>=0.115,<1", "uvicorn>=0.30,<1",
  "psutil>=6,<8", "dpkt>=1.9.8,<2", "numpy>=2,<3", "matplotlib>=3.9,<4"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.8,<1"]

[project.scripts]
m3 = "m3.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
